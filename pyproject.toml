[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acinus_diffusion"
version = "0.1.0"
description = "Oxygen diffusion modeling in the pulmonary acinus"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Aya Kamouni"},
    {name = "Kpankpan Edouard Kambire"},
    {name = "H'nia Harras"},
    {name = "Anas Sabbahi"},
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0.0"]
dev = ["pytest>=6.0.0", "pytest-cov>=2.0.0", "flake8>=4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
